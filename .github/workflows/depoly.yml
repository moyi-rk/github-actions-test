name: Depoly
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        uses: appleboy/ssh-action@1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            ls -al
            touch test.txt
            echo "hello mrk depoly" >> test.txt
            cat test.txt
